<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- AI UI app icon: a screen of the app in one glance - circles in a rounded rectangle.
       A 2x2 grid of large circles (the choices the AI offers) over the small bottom row.
       macOS grid: 824px rounded square centred on the 1024 canvas, soft shadow.
       Rendered to PNGs and AppIcon.icns by make_icon.sh. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a7bff"/>
      <stop offset="0.55" stop-color="#4263eb"/>
      <stop offset="1" stop-color="#2f45c4"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="172" x2="0" y2="718" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="100" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Soft shadow under the tile (stacked translucent layers: renders the same everywhere). -->
  <g fill="#0b0b30">
    <rect x="96" y="112" width="832" height="832" rx="190" opacity="0.05"/>
    <rect x="98" y="110" width="828" height="828" rx="188" opacity="0.07"/>
    <rect x="100" y="108" width="824" height="824" rx="186" opacity="0.10"/>
  </g>

  <!-- Tile. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- The circles: shadow, then face. -->
  <g fill="#13206e" opacity="0.26">
    <circle cx="362" cy="312" r="128"/>
    <circle cx="662" cy="312" r="128"/>
    <circle cx="362" cy="602" r="128"/>
    <circle cx="662" cy="602" r="128"/>
  </g>
  <g fill="url(#face)">
    <circle cx="362" cy="300" r="128"/>
    <circle cx="662" cy="300" r="128"/>
    <circle cx="362" cy="590" r="128"/>
    <circle cx="662" cy="590" r="128"/>
  </g>

  <!-- Bottom row. -->
  <g fill="#ffffff">
    <circle cx="402" cy="818" r="30" opacity="0.4"/>
    <circle cx="512" cy="818" r="40"/>
    <circle cx="622" cy="818" r="30" opacity="0.4"/>
  </g>
</svg>
