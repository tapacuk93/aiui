<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI UI</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="top">
    <nav id="path"></nav>
    <h1 id="title"></h1>
    <p id="message"></p>
  </header>

  <main id="stage">
    <div id="circles"></div>
    <div id="view"></div>
  </main>

  <textarea id="write" spellcheck="false" placeholder=""></textarea>
  <button id="close" type="button" title="Close (Esc)">×</button>

  <footer id="bottom">
    <div id="status"></div>
    <div id="nav">
      <button id="prev" class="page" type="button" title="Previous page (←)">‹ Back</button>
      <button id="go" type="button">Go</button>
      <button id="more" class="page" type="button" title="Next page (→)">More ›</button>
    </div>
  </footer>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
