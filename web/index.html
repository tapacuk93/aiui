<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI UI</title>
  <meta name="description" content="AI UI — an interface made of circles, generated by AI as you go.">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="top">
    <nav id="path"></nav>
    <h1 id="title"></h1>
    <textarea id="write" rows="1" spellcheck="false" placeholder=""></textarea>
    <p id="message"></p>
  </header>

  <main id="stage">
    <div id="circles"></div>
    <div id="view"></div>
  </main>

  <button id="close" type="button" title="Close (Esc)">×</button>

  <footer id="bottom">
    <div id="status"></div>
    <div id="nav">
      <button id="prev" class="page" type="button" title="Previous page (←)">‹ Back</button>
      <button id="go" type="button">Go</button>
      <button id="more" class="page" type="button" title="Next page (→)">More ›</button>
    </div>
  </footer>

  <div id="toast"></div>

  <a id="webnote" href="https://github.com/tapacuk93/aiui" target="_blank" rel="noopener">AI UI · web version · Mac app ↗</a>

  <script src="backend.js"></script>
  <script src="app.js"></script>
</body>
</html>
