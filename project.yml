# The iOS app (XcodeGen: `xcodegen` → AIUI.xcodeproj). The Mac app is built by build.sh
# (CEF/Blink can't be built by Xcode's normal app template); both share Sources/App.
name: AIUI
options:
  bundleIdPrefix: com.oeaio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: HTS38ZPRVH
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

packages:
  # Local path package (shared ~/src parent), as in the other apps.
  AICoinKit:
    path: ../aicoin/mobile-purchase/ios

targets:
  AIUI:
    type: application
    platform: iOS
    attributes:
      DevelopmentTeam: HTS38ZPRVH
      ProvisioningStyle: Automatic
    sources:
      - path: Sources/App
      - path: Sources/iOS
      - path: Resources/iOS/Assets.xcassets
      - path: web
        type: folder
        buildPhase: resources
    dependencies:
      - package: AICoinKit
    entitlements:
      path: Resources/iOS/AIUI.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.oeaio.aiui]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.oeaio.aiui]
    info:
      path: Resources/iOS/Info.plist
      properties:
        CFBundleDisplayName: AI UI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSUbiquitousContainers:
          iCloud.com.oeaio.aiui:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: AI UI
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oeaio.aiui
        PRODUCT_NAME: AIUI
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
