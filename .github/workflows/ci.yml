# Gates for pull requests and pushes to main; release.yml calls the same jobs before releasing.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: Services tests, 100% line/branch/function coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # the coverage thresholds need Node >= 22.8
      - name: Install (the tests use the real AWS SDK clients with faked sends)
        working-directory: services
        run: npm ci
      - name: Tests + coverage gate
        run: tools/coverage/services.sh

  os-installer:
    name: os-installer tests, 100% line coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Tests + coverage gate
        run: tools/os-installer/coverage.sh --report

  swift:
    name: App Swift tests, 100% line coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Tests + coverage gate
        run: tools/coverage/swift.sh

  # The Mac app: build.sh downloads CEF from the public CDN and signs ad hoc, so it needs no secrets.
  # Not yet proven on hosted runners (toolchain version, time), so it does not block the gates.
  # Only in CI itself: release.yml builds and attaches the app on its own.
  mac-app:
    name: Mac app (build.sh)
    if: github.workflow == 'CI'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: vendor/cef
          key: cef-${{ runner.os }}-${{ hashFiles('build.sh') }}
      - name: Build
        run: ./build.sh
